<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="FilSoft – Glass Clock Weather Card Plus for Home Assistant">
  <defs>
    <radialGradient id="bgGlow1" cx="12%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#00b4ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="88%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#9646ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a5885" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1a2742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4e2a7a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ff3ff"/>
      <stop offset="100%" stop-color="#b98bff"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ff3ff"/>
      <stop offset="100%" stop-color="#b98bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="220" rx="22" fill="#050811"/>
  <rect width="1000" height="220" rx="22" fill="url(#bgGlow1)"/>
  <rect width="1000" height="220" rx="22" fill="url(#bgGlow2)"/>
  <rect x="0.75" y="0.75" width="998.5" height="218.5" rx="21.25" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Glass Icon Badge -->
  <g transform="translate(64, 42)">
    <rect width="136" height="136" rx="34" fill="url(#iconBg)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <!-- Stylized Home + Clock/Pulse Mark -->
    <g filter="url(#glow)" fill="none" stroke="url(#accentV)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 64 L68 33 L104 64"/>
      <path d="M40 58 V98 A6 6 0 0 0 46 104 H56"/>
      <path d="M96 58 V98 A6 6 0 0 1 90 104 H80"/>
    </g>
    <circle cx="68" cy="76" r="10" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Brand Title -->
  <text x="242" y="114" font-family="'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="78" font-weight="300" letter-spacing="-1">
    <tspan fill="#f2f6ff">Fil</tspan><tspan fill="url(#accent)" font-weight="500">Soft</tspan>
  </text>

  <!-- Subtitle -->
  <text x="246" y="158" font-family="'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" font-weight="500" fill="#a8b7d4" letter-spacing="4.2">
    GLASS CLOCK WEATHER CARD PLUS · HOME ASSISTANT
  </text>
</svg>
